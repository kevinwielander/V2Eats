<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2Eats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .last-updated {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .language-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .language-toggle button {
            padding: 8px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .language-toggle button:hover {
            background: white;
            color: #667eea;
        }

        .language-toggle button.active {
            background: white;
            color: #667eea;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .filter-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .filter-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .restaurant-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .restaurant-card.unavailable {
            opacity: 0.6;
            background: #f5f5f5;
        }

        .restaurant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .restaurant-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-badge.available {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .menu-items {
            list-style: none;
        }

        .menu-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .item-price {
            color: #667eea;
            font-weight: 600;
            font-size: 0.95em;
        }

        .item-description {
            font-size: 0.9em;
            color: #666;
            margin-top: 4px;
        }

        .dietary-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .dietary-badge.vegan {
            background: #d4edda;
            color: #155724;
        }

        .dietary-badge.vegetarian {
            background: #fff3cd;
            color: #856404;
        }

        .dietary-badge.meat {
            background: #f8d7da;
            color: #721c24;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-buttons button {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.3s;
        }

        .filter-buttons button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-buttons button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .no-items {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.9em;
        }

        .visit-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .visit-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .restaurants-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ V2Eats</h1>
            <p style="font-size: 1.2em; margin-top: 10px;" id="subtitle">Viertel Zwei Daily Menus</p>
            <p class="last-updated" id="lastUpdated">Loading...</p>
            <div class="language-toggle">
                <button id="langDE" onclick="setLanguage('de')">🇦🇹 Deutsch</button>
                <button id="langEN" onclick="setLanguage('en')" class="active">🇬🇧 English</button>
            </div>
        </header>

        <div class="filter-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 Search restaurants or menu items..."
                autocomplete="off"
            >
            <div class="filter-buttons">
                <button id="filterAll" onclick="setDietaryFilter('all')" class="active">
                    <span id="filterAllText">All</span>
                </button>
                <button id="filterVegan" onclick="setDietaryFilter('vegan')">
                    🌱 <span id="filterVeganText">Vegan</span>
                </button>
                <button id="filterVegetarian" onclick="setDietaryFilter('vegetarian')">
                    🥬 <span id="filterVegetarianText">Vegetarian</span>
                </button>
                <button id="filterMeat" onclick="setDietaryFilter('meat')">
                    🍖 <span id="filterMeatText">Meat</span>
                </button>
            </div>
        </div>

        <div id="restaurantsContainer">
            <div class="loading">Loading menus...</div>
        </div>
    </div>

    <script>
        let allRestaurants = [];
        let currentLanguage = 'en';
        let currentDietaryFilter = 'all';

        // Translation dictionary
        const translations = {
            de: {
                subtitle: 'Viertel Zwei Tagesmenüs',
                lastUpdated: 'Zuletzt aktualisiert',
                searchPlaceholder: '🔍 Restaurants oder Gerichte suchen...',
                open: '✓ Geöffnet',
                closed: '✗ Geschlossen',
                noItems: 'Keine Menüpunkte verfügbar',
                visitWebsite: 'Website besuchen →',
                loading: 'Lädt Menüs...',
                noResults: 'Keine Restaurants gefunden.',
                failedToLoad: 'Fehler beim Laden der Menüs. Bitte versuchen Sie es später erneut.',
                filterAll: 'Alle',
                filterVegan: 'Vegan',
                filterVegetarian: 'Vegetarisch',
                filterMeat: 'Fleisch',
                dietaryVegan: 'Vegan',
                dietaryVegetarian: 'Vegetarisch',
                dietaryMeat: 'Fleisch',
            },
            en: {
                subtitle: 'Viertel Zwei Daily Menus',
                lastUpdated: 'Last updated',
                searchPlaceholder: '🔍 Search restaurants or menu items...',
                open: '✓ Open',
                closed: '✗ Closed',
                noItems: 'No menu items available',
                visitWebsite: 'Visit website →',
                loading: 'Loading menus...',
                noResults: 'No restaurants found.',
                failedToLoad: 'Failed to load menus. Please try again later.',
                filterAll: 'All',
                filterVegan: 'Vegan',
                filterVegetarian: 'Vegetarian',
                filterMeat: 'Meat',
                dietaryVegan: 'Vegan',
                dietaryVegetarian: 'Vegetarian',
                dietaryMeat: 'Meat',
            }
        };

        function setDietaryFilter(filter) {
            currentDietaryFilter = filter;
            
            // Update button states
            document.querySelectorAll('.filter-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`).classList.add('active');
            
            // Re-render with filter
            displayRestaurants(allRestaurants);
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Update button states
            document.getElementById('langDE').classList.toggle('active', lang === 'de');
            document.getElementById('langEN').classList.toggle('active', lang === 'en');
            
            // Update UI text
            const t = translations[lang];
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('filterAllText').textContent = t.filterAll;
            document.getElementById('filterVeganText').textContent = t.filterVegan;
            document.getElementById('filterVegetarianText').textContent = t.filterVegetarian;
            document.getElementById('filterMeatText').textContent = t.filterMeat;
            
            // Save preference
            localStorage.setItem('v2eats-language', lang);
            
            // Re-render restaurants
            displayRestaurants(allRestaurants);
        }

        // Fetch and display menus
        async function loadMenus() {
            try {
                const response = await fetch('docs/menus.json');
                const data = await response.json();
                
                allRestaurants = data.restaurants || [];
                
                // Update last updated time
                const lastUpdated = new Date(data.last_updated);
                const t = translations[currentLanguage];
                document.getElementById('lastUpdated').textContent = 
                    `${t.lastUpdated}: ${lastUpdated.toLocaleString()}`;
                
                displayRestaurants(allRestaurants);
            } catch (error) {
                const t = translations[currentLanguage];
                document.getElementById('restaurantsContainer').innerHTML = 
                    `<div class="no-results">${t.failedToLoad}</div>`;
                console.error('Error loading menus:', error);
            }
        }

        function displayRestaurants(restaurants) {
            const container = document.getElementById('restaurantsContainer');
            const t = translations[currentLanguage];
            
            // Filter restaurants by dietary preference
            let filteredRestaurants = restaurants.map(restaurant => {
                if (!restaurant.items || restaurant.items.length === 0) {
                    return restaurant;
                }
                
                // Filter items based on dietary filter
                let filteredItems = restaurant.items;
                if (currentDietaryFilter !== 'all') {
                    filteredItems = restaurant.items.filter(item => 
                        item.dietary === currentDietaryFilter
                    );
                }
                
                return {
                    ...restaurant,
                    items: filteredItems,
                    originalItemCount: restaurant.items.length
                };
            }).filter(restaurant => 
                // Keep restaurants with items or those that are unavailable
                restaurant.items.length > 0 || restaurant.available === false
            );
            
            if (filteredRestaurants.length === 0) {
                container.innerHTML = `<div class="no-results">${t.noResults}</div>`;
                return;
            }

            const html = filteredRestaurants.map(restaurant => {
                const isAvailable = restaurant.available !== false;
                const hasItems = restaurant.items && restaurant.items.length > 0;
                
                return `
                    <div class="restaurant-card ${isAvailable ? '' : 'unavailable'}">
                        <div class="restaurant-header">
                            <h2 class="restaurant-name">${restaurant.name}</h2>
                            <span class="status-badge ${isAvailable ? 'available' : 'unavailable'}">
                                ${isAvailable ? t.open : t.closed}
                            </span>
                        </div>
                        
                        ${!isAvailable && restaurant.reason ? 
                            `<div class="no-items">${restaurant.reason}</div>` : ''}
                        
                        ${hasItems ? `
                            <ul class="menu-items">
                                ${restaurant.items.map(item => {
                                    // Get name in current language
                                    const itemName = typeof item.name === 'object' 
                                        ? (item.name[currentLanguage] || item.name.en || item.name.de)
                                        : item.name;
                                    
                                    // Get description in current language
                                    const itemDesc = item.description 
                                        ? (typeof item.description === 'object'
                                            ? (item.description[currentLanguage] || item.description.en || item.description.de)
                                            : item.description)
                                        : '';
                                    
                                    // Get dietary badge text
                                    const dietaryText = item.dietary ? t[`dietary${item.dietary.charAt(0).toUpperCase() + item.dietary.slice(1)}`] : '';
                                    
                                    return `
                                    <li class="menu-item">
                                        <div class="item-name">${itemName}</div>
                                        ${item.price ? `<div class="item-price">${item.price}</div>` : ''}
                                        ${itemDesc ? `<div class="item-description">${itemDesc}</div>` : ''}
                                        ${item.dietary ? `<span class="dietary-badge ${item.dietary}">${dietaryText}</span>` : ''}
                                    </li>
                                `}).join('')}
                            </ul>
                        ` : isAvailable ? `<div class="no-items">${t.noItems}</div>` : ''}
                        
                        ${restaurant.error ? 
                            `<div class="error-message">⚠️ ${restaurant.error}</div>` : ''}
                        
                        ${restaurant.url ? 
                            `<a href="${restaurant.url}" target="_blank" class="visit-link">${t.visitWebsite}</a>` : ''}
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="restaurants-grid">${html}</div>`;
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            
            if (!searchTerm) {
                displayRestaurants(allRestaurants);
                return;
            }

            const filtered = allRestaurants.filter(restaurant => {
                // Search in restaurant name
                if (restaurant.name.toLowerCase().includes(searchTerm)) {
                    return true;
                }
                
                // Search in menu items
                if (restaurant.items) {
                    return restaurant.items.some(item => 
                        item.name.toLowerCase().includes(searchTerm) ||
                        (item.description && item.description.toLowerCase().includes(searchTerm))
                    );
                }
                
                return false;
            });

            displayRestaurants(filtered);
        });

        // Load saved language preference
        const savedLang = localStorage.getItem('v2eats-language') || 'en';
        setLanguage(savedLang);

        // Load menus on page load
        loadMenus();

        // Refresh every 5 minutes
        setInterval(loadMenus, 5 * 60 * 1000);
    </script>
</body>
</html>
